# dsh-flock bundle patch: mounts the flock plugin into the host composition of
# a dsh profile. The plugin registers its `flock_*` tools into the shared
# `tools` registry and one usage section into the global system prompt, so
# every session of the profile can start a self-organizing cluster through
# natural language.
#
# Install: `dsh plugin --profile <name> add <this package>` (npm or a local
# path). The `dsh plugin` command installs the package into the profile and
# reconciles it into the profile's `dsh.profile.bundles` layer list.
- insert:
    - id: flock
      # Node-resolvable package name — must stay in sync with package.json
      # `name`. Quoted because `@` is a reserved indicator in YAML and cannot
      # open a plain scalar.
      name: '@local/dsh-flock'
      config:
        # Cluster state lives under `<session workspace>/<root>/<clusterId>/`
        # (direction.md, config.json, store/agent-N.ndjson, environment/).
        root: .flock
        # Provider used to materialize agents as real DSH subagents. 'spawn'
        # gives each agent its own fresh session and the host's full tool set,
        # which is what lets an agent execute and verify its own artifact.
        provider: spawn
        defaultAgents: 4
        # amorphous = ring (diversity), swarm = most-recently-active (follow the
        # energy), mesh = everyone (fast alignment, collapses diversity).
        defaultAlgorithm: amorphous
        # Hard ceiling on cluster size. Every agent is a full DSH session, so
        # this is a refusal, not a queue: asking for more is an error.
        maxAgents: 10
